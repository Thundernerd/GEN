# GEN app settings. Values like ${NAME} are read from environment variables.

[server]
bind = "127.0.0.1:8080"
base_url = "http://localhost:8080"
# Enables the admin login (switch sources on/off on the Sources page). Long random value.
# admin_token = "${GEN_ADMIN_TOKEN}"

[database]
path = "data/gen.db"
# retention_days = 365            # delete items older than this, daily; unset keeps everything

[polling]
default_interval_minutes = 60
concurrency = 8
# github_token = "${GITHUB_TOKEN}"   # optional; also read from the GITHUB_TOKEN env var


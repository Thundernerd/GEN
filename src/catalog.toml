# --- BRUTAL (Ahwoo / RocketWerkz) -------------------------------------------------
# C# framework (not an engine: no editor/scene graph/renderer) behind Kitten Space
# Agency and RimWorld's Waylith engine; open-sourced 2026-10-15.
# Repo: github.com/ahwootech/BRUTAL. No GitHub releases; it tags each library
# separately (e.g. "Vulkan/v2026.10.2", ~35 libraries), so tags mode is the release
# signal (bursty when many libraries ship at once).
# Homepage https://ahwoo.com/brutal and forum https://forums.ahwoo.com/forums/brutal/
# were offline (503, "security update") on 2026-10-22, so no feed was verified.
# Revisit: the forum may expose an RSS feed once it is back.
# Aliases avoid bare "brutal" (a common word).
[[engine]]
id = "brutal"
name = "BRUTAL"

# The catalog of engines, general news outlets and their sources, built into the binary.
# A new database starts with the engines in `catalog::SEEDED`; everything else here is
# offered as a suggestion on the Sources page.
# Source kinds: feed, github (mode = releases|tags|commits), unity, hn, html.
# Categories: release, prerelease, news, video, community.
#   news      = blogs / news feeds
#   release   = GitHub releases/tags and release feeds (the classifier turns
#               version strings like "-beta"/"-rc"/"-preview" into prerelease)
# YouTube, forum, Reddit and Hacker News sources are left out on purpose.
# Commit-mode sources poll every 360 minutes because commits are noisy.
#
# Tiers say how prominent and active something is and whether it's a full engine, not
# which language it uses: 1 = major engines (widely used or very active full engines),
# 2 = smaller engines (niche, young or less active full engines), 3 = frameworks and
# libraries (frameworks, bindings and libraries: physics, ECS, networking, UI, ...).
# `languages` lists the languages you write games in with the engine, primary first,
# spelled one way across the catalog (C#, C++, F#, GDScript, Lua, ...); `language_note`
# adds nuance the list can't carry, e.g. "C# via the UnrealSharp plugin".
# Sources with `enabled = false` are added switched off.
# Aliases are matched as whole words against outlet articles: case-insensitively when
# all lowercase, case-sensitively when they contain an uppercase letter ("SDL").
# `icon` is a PNG/JPEG/WebP logo for Discord messages: the engine's own icon, or its
# GitHub organization's avatar (never a person's).
#
# All URLs below were verified with curl / the GitHub API on 2026-11-11.
#
# Redot Engine is intentionally excluded everywhere (user request).

# ===========================================================================
# Tier 1: major engines
# Widely used or very active full engines, any language.
# ===========================================================================

# --- Unity ------------------------------------------------------------------
[[engine]]
id = "unity"
name = "Unity"
tier = 1
languages = ["C#"]
language_note = "C# scripting, C++ core"
homepage = "https://unity.com"
icon = "https://unity.com/apple-touch-icon.png"
aliases = ["Unity", "UNITY", "unity3d", "unity engine", "unity 6", "unity technologies"]
exclude = [
  "ubuntu unity", "unity desktop", "unity shell", "unitypoint",
  # Game titles (common in GamingOnLinux coverage); they veto Unity for the whole item.
  "assassin's creed unity", "unity of command",
]
  [[engine.source]]
  kind = "feed"
  url = "https://unity.com/blog/rss"
  category = "news"
  # Editor releases via the Unity release JSON API.
  [[engine.source]]
  kind = "unity"
  limit = 25
  category = "release"

# --- Unreal Engine ------------------------------------------------------------
# The EpicGames/UnrealEngine GitHub repo is private (requires account linking),
# so there is no release source; releases are announced on the news feed.
# Note: the news feed is Atom but served as text/html.
[[engine]]
id = "unreal"
name = "Unreal Engine"
tier = 1
languages = ["C++", "Blueprints"]
language_note = "C# via the UnrealSharp plugin"
homepage = "https://www.unrealengine.com"
icon = "https://avatars.githubusercontent.com/u/6615685?s=128&v=4"
aliases = ["unreal", "unreal engine", "ue5", "ue6", "uefn", "metahuman", "nanite", "unrealsharp"]
  [[engine.source]]
  kind = "feed"
  url = "https://www.unrealengine.com/en-US/rss"
  category = "news"
  # UnrealSharp (the C# plugin) publishes no releases or tags, so follow its commits.
  [[engine.source]]
  kind = "github"
  repo = "UnrealSharp/UnrealSharp"
  mode = "commits"
  category = "news"
  interval_minutes = 360
  enabled = false


# ===========================================================================
# Skipped on purpose
# ===========================================================================
# - Duality: inactive.
# - Urho3D / UrhoSharp: Urho3D archived, UrhoSharp abandoned (see rbfx instead).
# - Xenko: renamed to Stride (covered via the "xenko" alias on Stride).
# - Ultraviolet: inactive.
# - Banshee: abandoned.
# - Hazel: educational C++ engine, no release cadence.
# - DefaultEcs: archived/unmaintained (see Arch / Friflo).
# - Veldrid: effectively unmaintained.
# - Game Dev Digest: newsletter paused since 2026-05.
# - Redot Engine: excluded at the user's request.
# - Construct: no GitHub repo, and construct.net answers 403 to GEN's user agent
#   (checked 2026-11-11).
# - PICO-8: no GitHub repo; updates are announced only on the lexaloffle.com forum.

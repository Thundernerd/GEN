# The catalog of engines, general news outlets and their sources, built into the binary.
# A new database starts with the engines in `catalog::SEEDED`; everything else here is
# offered as a suggestion on the Sources page.
# Source kinds: feed, github (mode = releases|tags|commits), unity, hn, html.
# Categories: release, prerelease, news, video, community.
#   news      = blogs / news feeds
#   release   = GitHub releases/tags and release feeds (the classifier turns
#               version strings like "-beta"/"-rc"/"-preview" into prerelease)
# YouTube, forum, Reddit and Hacker News sources are left out on purpose.
#
# Tiers: 1 = major or very active C#, 2 = niche C# (frameworks/libraries welcome),
#        3 = notable without C#.
# Sources with `enabled = false` are added switched off.
# Aliases are matched case-insensitively as whole words against outlet articles.
# `icon` is a PNG/JPEG/WebP logo for Discord messages: the engine's own icon, or its
# GitHub organization's avatar (never a person's).
#
# All URLs below were verified with curl / the GitHub API on 2026-10-22.
#
# Redot Engine is intentionally excluded everywhere (user request).

# ===========================================================================
# Tier 1: the user's own list
# ===========================================================================

# --- Unity ------------------------------------------------------------------
[[engine]]
id = "unity"
name = "Unity"
tier = 1
csharp = "native (C# scripting)"
homepage = "https://unity.com"
icon = "https://unity.com/apple-touch-icon.png"
aliases = ["Unity", "UNITY", "unity3d", "unity engine", "unity 6", "unity technologies"]
exclude = ["ubuntu unity", "unity desktop", "unity shell", "unitypoint"]
  [[engine.source]]
  kind = "feed"
  url = "https://unity.com/blog/rss"
  category = "news"
  # Editor releases via the Unity release JSON API.
  [[engine.source]]
  kind = "unity"
  limit = 25
  category = "release"


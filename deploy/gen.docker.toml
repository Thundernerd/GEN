# GEN app settings for containers (mounted as /app/config/gen.toml).
# Values like ${NAME} are read from environment variables. A referenced
# variable that is unset is a startup error, so only uncomment what you use.

[server]
bind = "0.0.0.0:8080"
# Public URL, used for links in /feed.xml and in notifications.
base_url = "http://localhost:8080"
templates_dir = "/app/templates"
static_dir = "/app/static"
# Enables the admin login for switching sources on and off. Use a long random value.
# admin_token = "${GEN_ADMIN_TOKEN}"

[database]
path = "/data/gen.db"

[polling]
default_interval_minutes = 60
concurrency = 8
# The GITHUB_TOKEN env var is picked up automatically when set, so there is
# no need to reference it here.

# Notification channels are managed on the website (/notifications, after
# logging in with the admin token). Their secrets can be entered as
# ${GEN_DISCORD_WEBHOOK} and the like, read from .env when sending.

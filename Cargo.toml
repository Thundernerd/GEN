[package]
name = "gen"
version = "0.1.0"
edition = "2024"
description = "Game Engine News"

[dependencies]
anyhow = "1.0.104"
atom_syndication = "0.12.10"
axum = "0.8.9"
blake3 = "1.8.7"
bytes = "1.12.1"
chrono = { version = "0.4.45", features = ["serde"] }
clap = { version = "4.6.7", features = ["derive", "env"] }
feed-rs = "3.0.0"
futures = "0.3.34"
lettre = { version = "0.11.23", default-features = false, features = ["builder", "hostname", "smtp-transport", "pool", "tokio1", "tokio1-rustls", "aws-lc-rs", "rustls-native-certs"] }
minijinja = { version = "3.0.2", features = ["serde"] }
regex = "1.13.1"
reqwest = { version = "0.13.5", features = ["json", "gzip", "brotli"] }
rusqlite = { version = "0.40.2", features = ["bundled", "chrono"] }
scraper = "0.29.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "time", "sync", "signal", "net"] }
toml = "1.1.8"
tower-http = { version = "0.7.1", features = ["fs", "compression-gzip"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "fmt"] }
url = "2.5.8"

[dev-dependencies]
http-body-util = "0.1.5"
tower = { version = "0.5.3", features = ["util"] }
